# This project was developed with assistance from AI tools.

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-planner"
version = "0.1.0"
description = "Cloud mission planning service for Unitree G1 humanoid robot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "tenacity>=9.0.0,<10.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-httpx>=0.30.0,<1.0",
    "respx>=0.22.0,<1.0",
    "ruff>=0.6.0,<1.0",
    "pre-commit>=4.0.0,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
