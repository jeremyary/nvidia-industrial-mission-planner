apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mission-planner
  template:
    metadata: {}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mission-planner
          image: quay.io/jary/mission-planner:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mission-planner-config
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 12
      volumes:
        - name: tmp
          emptyDir: {}
