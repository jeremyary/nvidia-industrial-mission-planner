# This project was developed with assistance from AI tools.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: tests
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true
